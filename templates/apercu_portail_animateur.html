{% extends "base.html" %}
{% block title %}Aperçu portail animateur{% endblock %}
{% block content %}
<main class="page-shell page-shell--narrow portal-preview-page">
  <section class="ui-card">
    <header class="ui-section-heading"><div><h1>Aperçu portail animateur</h1><p>Choisissez un animateur puis ouvrez son portail en lecture seule.</p></div></header>
    <form method="get" target="_blank" rel="noopener noreferrer" class="portal-preview-selector">
      <label for="apercu-animateur">Animateur
        <select id="apercu-animateur" name="animateur_id" required>
          <option value="">Choisir un animateur</option>
          {% for animateur in animateurs_apercu %}<option value="{{ animateur.pk }}">{{ animateur.prenom }} {{ animateur.nom }} — {% if animateur.utilisateur_id and animateur.utilisateur.is_active %}Compte portail actif{% else %}Compte portail non activé{% endif %}</option>{% endfor %}
        </select>
      </label>
      <input type="hidden" name="apercu_portail" value="1">
      <button class="btn btn-primary" type="submit">Ouvrir son portail en aperçu ↗</button>
    </form>
  </section>
</main>
{% endblock %}
